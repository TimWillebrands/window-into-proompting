# The Meter and the network the sandboxes live on. The Runner itself runs on the host, it needs Docker.
name: works

networks:
  sandbox:
    name: works-sandbox
    internal: true
  egress: {}

services:
  meter:
    image: node:24-alpine
    restart: unless-stopped
    command: node /app/src/meter-main.ts
    working_dir: /app
    # Long syntax: a missing models file fails the start instead of becoming a root-owned directory.
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKS_MODELS:-./models.json}
        target: /app/models.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      WORKS_UPSTREAM_URL: ${WORKS_UPSTREAM_URL:?}
      WORKS_UPSTREAM_KEY: ${WORKS_UPSTREAM_KEY:-}
      WORKS_METER_SECRET: ${WORKS_METER_SECRET:?}
      WORKS_BALANCE_URL: ${WORKS_BALANCE_URL:-}
    networks:
      sandbox:
        aliases: [meter]
      egress: {}
    ports:
      - 127.0.0.1:8789:8789
    extra_hosts:
      - host.docker.internal:host-gateway
