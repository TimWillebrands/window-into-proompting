<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="20" height="40" fill="#ffcc33"/>
      <rect x="20" width="20" height="40" fill="#e0402a"/>
    </pattern>
    <pattern id="checks" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#ffffff"/>
      <rect width="16" height="16" fill="#111111"/>
      <rect x="16" y="16" width="16" height="16" fill="#111111"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#stripes)"/>
  <rect x="0" y="300" width="400" height="300" fill="url(#checks)"/>
  <circle cx="560" cy="380" r="150" fill="#2a7d23"/>
  <circle cx="200" cy="160" r="110" fill="#316ac5"/>
  <circle cx="660" cy="120" r="70" fill="#8e44ad"/>
  <text x="40" y="580" font-family="Verdana, sans-serif" font-size="64" font-weight="bold" fill="#000">Glass needs a busy view</text>
  <text x="430" y="300" font-family="Verdana, sans-serif" font-size="40" fill="#fff">123 abc XYZ</text>
</svg>
