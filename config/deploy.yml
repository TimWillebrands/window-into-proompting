service: proompting
image: proompting-backend
deploy_timeout: 120

servers:
  web:
    - static.74.157.104.178.clients.your-server.de

proxy:
  hosts:
    - proompting.party
    - static.74.157.104.178.clients.your-server.de
  app_port: 5072
  path_prefix: /api
  strip_path_prefix: false

ssh:
  user: root
  keys:
    - ~/.ssh/hetzner_ed25519

registry:
  server: localhost:5555

builder:
  arch: amd64
  dockerfile: backend/Dockerfile
  context: .

env:
  clear:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:5072
    Llm__Providers__0__Type: openrouter
    Clerk__AdminUserIds__0: user_2ticN4zG13HbJjZG4FC8SsDNfZK
    OTEL_EXPORTER_OTLP_ENDPOINT: http://proompting-dashboard:18889
    POSTHOG_HOST: https://eu.i.posthog.com
    Tailnets__home: socks5://proompting-tailscale:1055
  secret:
    - POSTGRES_PASSWORD
    - OPENROUTER_API_KEY
    - CLERK_SECRET_KEY
    - ConnectionStrings__Default
    - POSTHOG_PROJECT_TOKEN

accessories:
  age-db:
    image: apache/age
    host: static.74.157.104.178.clients.your-server.de
    env:
      clear:
        POSTGRES_USER: partytown
        POSTGRES_DB: partytown
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - /data/postgres:/var/lib/postgresql
    files:
      - docker-entrypoint-initdb.d/01-orleans-main.sql:/docker-entrypoint-initdb.d/01-orleans-main.sql
      - docker-entrypoint-initdb.d/02-orleans-clustering.sql:/docker-entrypoint-initdb.d/02-orleans-clustering.sql
      - docker-entrypoint-initdb.d/03-orleans-clustering-3.7.0.sql:/docker-entrypoint-initdb.d/03-orleans-clustering-3.7.0.sql
      - docker-entrypoint-initdb.d/04-orleans-persistence.sql:/docker-entrypoint-initdb.d/04-orleans-persistence.sql
      - docker-entrypoint-initdb.d/05-age-setup.sql:/docker-entrypoint-initdb.d/05-age-setup.sql

  # Reaches local LLM providers on the tailnet (ADR 0033). No published port: SOCKS5 here has no auth.
  tailscale:
    image: tailscale/tailscale:v1.104.4
    host: static.74.157.104.178.clients.your-server.de
    env:
      clear:
        TS_HOSTNAME: proompting
        TS_STATE_DIR: /var/lib/tailscale
        TS_AUTH_ONCE: "true"
        TS_SOCKS5_SERVER: ":1055"
      secret:
        - TS_AUTHKEY
    volumes:
      - /data/tailscale:/var/lib/tailscale

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    host: static.74.157.104.178.clients.your-server.de
    port: "18888:18888"
    env:
      clear:
        DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
