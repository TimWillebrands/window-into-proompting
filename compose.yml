services:
    reverse-proxy:
        image: caddy:2.6.4-alpine
        ports:
            - "8080:8080"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
    frontend:
        image: partytown-frontend-dev
        container_name: dev-frontend
        working_dir: /app
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        ports:
            - "3000:3000"
            - "5173:5173"
            - "6006:6006"
            - "42069:42069"
        volumes:
            - ./frontend:/app:delegated
            - frontend_node_modules:/app/node_modules
        environment:
            - VITE_API_URL=http://backend:5072
        command: npm run dev -- --host 0.0.0.0 --port 3000 --strictPort

    backend:
        image: mcr.microsoft.com/dotnet/nightly/sdk:11.0-preview
        user: "${UID:-1000}:${GID:-1000}"
        container_name: dev-backend
        working_dir: ${PWD}/backend
        ports:
            - "5072:5072"
            - "11111:11111" # Orleans silo-to-silo
            - "30000:30000" # Orleans gateway
        volumes:
            # Do craaaazy stuff so that we can use the same .nuget folder across container
            # and host so the LSP can work properly... or something like that idk (shrug)
            - ${PWD}/backend:${PWD}/backend:delegated
            - ${PWD}/backend/.nuget:${PWD}/backend/.nuget
            - ${PWD}/backend/bin:${PWD}/backend/bin
            - ${PWD}/backend/obj:${PWD}/backend/obj
        environment:
            - ASPNETCORE_URLS=http://0.0.0.0:5072
            - DOTNET_USE_POLLING_FILE_WATCHER=1
            - ASPNETCORE_ENVIRONMENT=Development
            - NUGET_PACKAGES=${PWD}/backend/.nuget
            - ConnectionStrings__Default=Host=age-db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://dashboard:18889
            - Logging__LogLevel__Default=Information
            - Logging__LogLevel__Microsoft=Warning
        depends_on:
            backend-init:
                condition: service_completed_successfully
            age-db:
                condition: service_healthy
        networks:
            - default
            - app-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: dotnet watch run --project backend.csproj --non-interactive --always-restart --urls http://0.0.0.0:5072
        # command: dotnet run --project backend.csproj --urls http://0.0.0.0:5072

    # Silly init command to bless all dotnet folders with correct permissions
    # so the container and LSPs play nice together.
    backend-init:
        image: mcr.microsoft.com/dotnet/nightly/sdk:11.0-preview
        container_name: dev-backend-init
        working_dir: ${PWD}/backend
        volumes:
            - ${PWD}/backend:${PWD}/backend:delegated
            - ${PWD}/backend/.nuget:${PWD}/backend/.nuget
            - ${PWD}/backend/bin:${PWD}/backend/bin
            - ${PWD}/backend/obj:${PWD}/backend/obj
        command: sh -lc "mkdir -p ${PWD}/backend/.nuget ${PWD}/backend/obj ${PWD}/backend/bin && chown -R ${UID:-1000}:${GID:-1000} ${PWD}/backend/.nuget ${PWD}/backend/obj ${PWD}/backend/bin"

    age-db:
        image: apache/age
        container_name: age-db
        ports:
            - "${HOST_DB_PORT:-5455}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - age-data:/var/lib/postgresql
            - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
        networks:
            - app-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 12

    pgadmin:
        image: dpage/pgadmin4
        container_name: dev-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@local.dev
            PGADMIN_DEFAULT_PASSWORD: admin
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        ports:
            - "5050:80"
        volumes:
            - pgadmin-data:/var/lib/pgadmin
            - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
        depends_on:
            age-db:
                condition: service_healthy
        networks:
            - app-network

    # Ew, microsoft, goor
    dashboard:
        image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
        container_name: dashboard
        ports:
            - "18888:18888" # Dashboard web UI
            - "4317:18889" # OTLP gRPC endpoint
            - "4318:18890" # OTLP HTTP endpoint
        environment:
            # Skips the login page for local development
            - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true

volumes:
    age-data:
    frontend_node_modules:
    pgadmin-data:

networks:
    app-network:
